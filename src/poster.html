<!doctype html>
<html><head><meta charset="utf-8"><title>MIRASORA</title>
<style>
  html,body{margin:0;padding:0;background:#f3eee2;width:1024px;height:1024px;overflow:hidden}
  svg{display:block}
  .title{font-family:'Bahnschrift','Segoe UI',sans-serif;font-variation-settings:'wght' 700,'wdth' 82}
  .sub{font-family:'Bahnschrift','Segoe UI',sans-serif;font-variation-settings:'wght' 600,'wdth' 90}
</style></head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#0e3f9e"/>
    <stop offset="0.35" stop-color="#2c7fe0"/>
    <stop offset="0.62" stop-color="#7cc4f4"/>
    <stop offset="0.80" stop-color="#ffd9b8"/>
    <stop offset="0.90" stop-color="#ffb995"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
    <stop offset="0.12" stop-color="#fffbe6" stop-opacity="0.95"/>
    <stop offset="0.4" stop-color="#ffe9b0" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#ffd59a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="treeglow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#ffe6f2" stop-opacity="0.9"/>
    <stop offset="0.5" stop-color="#ffb7d8" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#ff9cc8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="rockU" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#5a4a7a"/>
    <stop offset="0.6" stop-color="#8a6f9a"/>
    <stop offset="1" stop-color="#d8a7a4"/>
  </linearGradient>
  <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b8ec6e"/>
    <stop offset="0.4" stop-color="#5fbf55"/>
    <stop offset="1" stop-color="#1f7a4a"/>
  </linearGradient>
  <linearGradient id="titlefill" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset="0.6" stop-color="#fff1f7"/>
    <stop offset="1" stop-color="#ffc6df"/>
  </linearGradient>
  <linearGradient id="fall" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#e6f6ff" stop-opacity="0.1"/>
  </linearGradient>
  <filter id="blur6"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="frame"><rect x="28" y="28" width="968" height="914"/></clipPath>
</defs>

<rect width="1024" height="1024" fill="#f3eee2"/>
<g clip-path="url(#frame)">
  <rect x="0" y="0" width="1024" height="960" fill="url(#sky)"/>
  <!-- towering summer cumulus, lit gold on the sun side -->
  <g id="cumulus"></g>
  <!-- the sun and its rays -->
  <g id="rays" opacity="0.35"></g>
  <circle cx="190" cy="330" r="260" fill="url(#sun)"/>
  <!-- distant little floating isles -->
  <g id="isles"></g>
  <!-- sea of clouds far below -->
  <g id="cloudsea"></g>

  <!-- the floating isle of Mirasora -->
  <g id="falls"></g>
  <path d="M500 500 Q520 470 600 462 Q700 452 800 466 Q870 476 880 500 Q860 540 820 580 Q790 640 740 700 Q720 740 700 790 Q680 730 650 690 Q600 630 560 590 Q520 550 500 500 Z" fill="url(#rockU)"/>
  <path d="M700 790 Q720 740 740 700 Q790 640 820 580 Q860 540 880 500 L840 520 Q800 600 760 650 Q730 700 700 790 Z" fill="#f2b9a8" opacity="0.5"/>
  <g id="crags"></g>
  <path d="M496 500 Q520 466 600 456 Q700 446 800 460 Q872 470 884 500 Q850 512 690 514 Q540 514 496 500 Z" fill="#7fd36a"/>
  <path d="M496 500 Q540 514 690 514 Q850 512 884 500 Q850 522 690 524 Q540 524 496 500 Z" fill="#4f9f55"/>
  <g id="houses"></g>
  <!-- the great sakura -->
  <circle cx="690" cy="360" r="230" fill="url(#treeglow)"/>
  <path d="M680 500 C684 460 676 430 660 404 L672 398 C684 416 690 430 692 444 C698 420 712 404 730 392 L738 400 C718 414 706 440 704 470 C702 482 704 492 708 500 Z" fill="#6a4258"/>
  <g id="canopy"></g>
  <g id="petals"></g>

  <!-- foreground hill -->
  <path d="M0 800 Q220 740 470 770 Q700 800 1024 760 L1024 960 L0 960 Z" fill="url(#hill)"/>
  <path d="M0 800 Q220 740 470 770 Q700 800 1024 760" stroke="#e8ffb0" stroke-width="4" fill="none" opacity="0.8"/>
  <g id="grass"></g>
  <g id="flowers"></g>

  <!-- the girl on the hill, hat in hand, hair in the wind -->
  <g>
    <path d="M262 768 C250 730 252 690 262 668 L278 664 C276 700 284 740 300 770 Z" fill="#26346a"/>
    <path d="M262 676 C232 680 214 700 196 712 C214 708 236 704 256 700 Z" fill="#26346a"/>
    <path d="M266 672 C226 670 200 690 176 694 C204 700 236 690 262 686 Z" fill="#33468a"/>
    <path d="M250 900 C246 840 252 790 262 760 C268 744 300 744 306 760 C316 790 326 840 322 900 Z" fill="#ffffff"/>
    <path d="M296 752 C310 776 322 840 322 900 L306 900 C306 846 300 790 288 760 Z" fill="#cfe0f6"/>
    <path d="M264 758 C252 740 244 724 242 708" stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none"/>
    <path d="M304 760 C318 744 330 726 336 704" stroke="#ffffff" stroke-width="9" stroke-linecap="round" fill="none"/>
    <circle cx="242" cy="704" r="5" fill="#f2c6a8"/>
    <ellipse cx="342" cy="694" rx="30" ry="10" fill="#f6dfa0" transform="rotate(-24 342 694)"/>
    <path d="M332 690 Q342 674 354 686" fill="#f2cf80"/>
    <circle cx="282" cy="716" r="20" fill="#26346a"/>
    <path d="M282 696 C300 700 304 724 298 744 C292 730 286 720 282 716 Z" fill="#33468a"/>
    <path d="M300 712 a20 20 0 0 1 -4 18" stroke="#ffe7c2" stroke-width="3" fill="none"/>
    <rect x="276" y="734" width="12" height="12" rx="3" fill="#f2c6a8"/>
    <path d="M262 900 h22 v10 h-22 z M292 900 h22 v10 h-22 z" fill="#f2c6a8"/>
  </g>

  <!-- title -->
  <text x="512" y="188" text-anchor="middle" class="title" font-size="176" textLength="860" lengthAdjust="spacingAndGlyphs" fill="#0b2f7a" opacity="0.6" transform="translate(5,7)">MIRASORA</text>
  <text x="512" y="188" text-anchor="middle" class="title" font-size="176" textLength="860" lengthAdjust="spacingAndGlyphs" fill="#e0558f" transform="translate(2,3)">MIRASORA</text>
  <text x="512" y="188" text-anchor="middle" class="title" font-size="176" textLength="860" lengthAdjust="spacingAndGlyphs" fill="url(#titlefill)">MIRASORA</text>
  <g id="sparkle"></g>
</g>

<rect x="28" y="942" width="968" height="54" fill="#f3eee2"/>
<text x="512" y="980" text-anchor="middle" class="sub" font-size="30" letter-spacing="8" fill="#22306a">THE FLOATING SAKURA ISLE</text>
<rect x="90" y="969" width="110" height="2" fill="#e0558f"/>
<rect x="824" y="969" width="110" height="2" fill="#e0558f"/>
<rect x="28" y="28" width="968" height="968" fill="none" stroke="#22306a" stroke-width="2"/>
</svg>

<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg';
  let seed = 31415;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const el = (parent, tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    document.getElementById(parent).appendChild(n);
    return n;
  };

  // anime cumulus: stacked puffs, lavender shade below, white tops, gold rim toward the sun
  const cumulus = (g, cx, base, w, h, n) => {
    for (let i = 0; i < n; i++) {
      const t = i / n;
      const y = base - t * h;
      const spread = w * (1 - t * 0.6);
      const x = cx + (rnd() - 0.5) * spread;
      const r = 30 + rnd() * 50 * (1 - t * 0.4);
      el(g, 'circle', {cx: x, cy: y + r * 0.25, r: r, fill: '#b9b3e0'});
      el(g, 'circle', {cx: x - r * 0.12, cy: y, r: r * 0.95, fill: '#ffffff'});
      el(g, 'circle', {cx: x - r * 0.3, cy: y - r * 0.2, r: r * 0.5, fill: '#fff6dc', opacity: 0.8});
    }
  };
  cumulus('cumulus', 900, 640, 260, 420, 26);
  cumulus('cumulus', 120, 660, 220, 260, 16);
  cumulus('cumulus', 470, 650, 200, 160, 10);

  // sun rays
  for (let i = 0; i < 14; i++) {
    const a = -0.2 + (i / 14) * 1.9;
    el('rays', 'path', {d: `M190 330 L${190 + Math.cos(a - 0.03) * 1100} ${330 + Math.sin(a - 0.03) * 1100} L${190 + Math.cos(a + 0.03) * 1100} ${330 + Math.sin(a + 0.03) * 1100} Z`, fill: '#fffbe6'});
  }

  // distant floating isles with tiny trees and threads of waterfall
  for (const [x, y, s] of [[300, 470, 0.9], [130, 560, 0.6], [960, 610, 0.5], [420, 600, 0.45]]) {
    el('isles', 'path', {d: `M${x - 50*s} ${y} Q${x} ${y - 10*s} ${x + 50*s} ${y} Q${x + 20*s} ${y + 40*s} ${x} ${y + 80*s} Q${x - 20*s} ${y + 40*s} ${x - 50*s} ${y} Z`, fill: '#8f8cc4', opacity: 0.85});
    el('isles', 'ellipse', {cx: x, cy: y, rx: 50*s, ry: 6*s, fill: '#8fd47a'});
    el('isles', 'circle', {cx: x - 10*s, cy: y - 16*s, r: 16*s, fill: '#ffb3d1'});
    el('isles', 'rect', {x: x + 30*s, y: y, width: 3*s, height: 70*s, fill: '#ffffff', opacity: 0.7});
  }

  // sea of clouds below the isle
  for (let i = 0; i < 70; i++) {
    const x = rnd() * 1100 - 40, y = 690 + rnd() * 90;
    const r = 30 + rnd() * 45;
    el('cloudsea', 'circle', {cx: x, cy: y + 8, r: r, fill: '#d6d4f2'});
    el('cloudsea', 'circle', {cx: x - 5, cy: y, r: r * 0.92, fill: '#ffffff'});
  }

  // waterfalls pouring off the isle into the clouds
  for (const [x, w] of [[540, 16], [610, 10], [820, 18], [858, 9]]) {
    el('falls', 'rect', {x: x, y: 500, width: w, height: 240, fill: 'url(#fall)'});
    el('falls', 'circle', {cx: x + w / 2, cy: 735, r: 26, fill: '#ffffff', opacity: 0.8});
  }

  // crags on the underside
  for (let i = 0; i < 26; i++) {
    const x = 530 + rnd() * 320, y = 520 + rnd() * 150;
    el('crags', 'path', {d: `M${x} ${y} l${6 + rnd() * 10} ${14 + rnd() * 20} l${-12 - rnd() * 8} 0 z`, fill: rnd() < 0.5 ? '#4b3d6a' : '#a88aa8', opacity: 0.7});
  }

  // a shrine village tucked under the tree: white walls, vermilion roofs
  for (const [x, w] of [[540, 30], [578, 24], [770, 28], [806, 34], [846, 22]]) {
    el('houses', 'rect', {x: x, y: 482, width: w, height: 18, fill: '#fff8ee'});
    el('houses', 'path', {d: `M${x - 6} ${483} Q${x + w / 2} ${468} ${x + w + 6} ${483} Z`, fill: '#e2453c'});
    el('houses', 'rect', {x: x + w / 2 - 3, y: 490, width: 6, height: 10, fill: '#ffcf6a'});
  }
  // a little vermilion pagoda
  for (let k = 0; k < 3; k++) {
    const y = 486 - k * 18, w = 40 - k * 9;
    el('houses', 'rect', {x: 610 - w / 2 + 6, y: y - 8, width: w - 12, height: 10, fill: '#fff8ee'});
    el('houses', 'path', {d: `M${610 - w / 2 - 6} ${y - 6} Q610 ${y - 18} ${610 + w / 2 + 6} ${y - 6} Z`, fill: '#e2453c'});
  }

  // the sakura canopy: hundreds of blossoms, lit from the sun side
  for (let i = 0; i < 360; i++) {
    const a = rnd() * Math.PI * 2, d = Math.pow(rnd(), 0.55);
    const x = 690 + Math.cos(a) * d * 170, y = 345 + Math.sin(a) * d * 95 - (1 - d) * 20;
    const lit = Math.cos(a + 2.4) > 0.2;
    el('canopy', 'circle', {cx: x.toFixed(1), cy: y.toFixed(1), r: (10 + rnd() * 16).toFixed(1),
      fill: lit ? ['#ffd6e8', '#ffe8f2', '#ffc2dc'][Math.floor(rnd() * 3)] : ['#f58cba', '#e86fa6', '#ffa6cb'][Math.floor(rnd() * 3)], opacity: 0.95});
  }

  // petals carried on the wind from the tree to the girl
  for (let i = 0; i < 160; i++) {
    const t = rnd();
    const x = 690 - t * 520 + (rnd() - 0.5) * 160;
    const y = 380 + t * 330 + Math.sin(t * 9) * 40 + (rnd() - 0.5) * 120;
    el('petals', 'ellipse', {cx: x.toFixed(1), cy: y.toFixed(1), rx: (2 + rnd() * 3).toFixed(1), ry: (1.2 + rnd() * 1.5).toFixed(1),
      fill: rnd() < 0.6 ? '#ffc2dc' : '#ffffff', transform: `rotate(${(rnd() * 180).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})`, opacity: 0.95});
  }

  // grass and flowers on the hill
  for (let i = 0; i < 420; i++) {
    const x = rnd() * 1024, y = 790 + Math.pow(rnd(), 0.8) * 160;
    if (x > 230 && x < 340 && y < 905) continue;
    const h = 8 + (y - 780) / 160 * 20;
    el('grass', 'path', {d: `M${x.toFixed(1)} ${y.toFixed(1)} q${(-2 - rnd() * 3).toFixed(1)} ${(-h * 0.6).toFixed(1)} ${(-6 - rnd() * 6).toFixed(1)} ${(-h).toFixed(1)}`,
      stroke: rnd() < 0.5 ? '#2f8a45' : '#d8ff8a', 'stroke-width': (1 + (y - 780) / 80).toFixed(1), fill: 'none', 'stroke-linecap': 'round'});
  }
  for (let i = 0; i < 160; i++) {
    const x = rnd() * 1024, y = 800 + Math.pow(rnd(), 0.7) * 150;
    if (x > 230 && x < 340 && y < 905) continue;
    const s = 1.5 + (y - 790) / 150 * 4;
    el('flowers', 'circle', {cx: x, cy: y, r: s, fill: ['#ffffff', '#ffd1e4', '#fff07a', '#9fd0ff'][Math.floor(rnd() * 4)]});
  }

  // anime sparkle glints
  for (const [x, y, s] of [[150, 300, 26], [610, 270, 14], [860, 250, 16], [400, 440, 10]]) {
    el('sparkle', 'path', {d: `M${x} ${y - s} Q${x} ${y} ${x + s} ${y} Q${x} ${y} ${x} ${y + s} Q${x} ${y} ${x - s} ${y} Q${x} ${y} ${x} ${y - s} Z`, fill: '#ffffff', opacity: 0.95});
  }
})();
</script>
</body></html>
