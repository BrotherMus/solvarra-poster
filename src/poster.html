<!doctype html>
<html><head><meta charset="utf-8"><title>SOLVARRA</title>
<style>
  html,body{margin:0;padding:0;background:#f3e6cc;width:1024px;height:1024px;overflow:hidden}
  svg{display:block}
  .title{font-family:'Bahnschrift','Segoe UI',sans-serif;font-weight:700;font-variation-settings:'wght' 700,'wdth' 78}
  .sub{font-family:'Bahnschrift','Segoe UI',sans-serif;font-variation-settings:'wght' 600,'wdth' 90}
</style></head>
<body>
<svg id="p" xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#141a46"/>
    <stop offset="0.30" stop-color="#3b2766"/>
    <stop offset="0.52" stop-color="#9c3f78"/>
    <stop offset="0.68" stop-color="#e86f63"/>
    <stop offset="0.80" stop-color="#ffb066"/>
    <stop offset="0.86" stop-color="#ffd58a"/>
  </linearGradient>
  <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#f3a865"/>
    <stop offset="0.10" stop-color="#c9707a"/>
    <stop offset="0.35" stop-color="#2f7d93"/>
    <stop offset="1" stop-color="#0b3350"/>
  </linearGradient>
  <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
    <stop offset="0.25" stop-color="#ffd27e" stop-opacity="0.6"/>
    <stop offset="0.6" stop-color="#ff9a5e" stop-opacity="0.22"/>
    <stop offset="1" stop-color="#ff7a5a" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="bellglow" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#fff6cf" stop-opacity="0.95"/>
    <stop offset="0.35" stop-color="#ffd36b" stop-opacity="0.45"/>
    <stop offset="1" stop-color="#ffb347" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff6d6"/>
    <stop offset="0.45" stop-color="#ffd677"/>
    <stop offset="1" stop-color="#e3922f"/>
  </linearGradient>
  <linearGradient id="bell" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#b8661c"/>
    <stop offset="0.35" stop-color="#ffe08a"/>
    <stop offset="0.6" stop-color="#f7b746"/>
    <stop offset="1" stop-color="#9a4f16"/>
  </linearGradient>
  <linearGradient id="tower" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffe9cf"/>
    <stop offset="0.55" stop-color="#f6d2b4"/>
    <stop offset="1" stop-color="#b9808a"/>
  </linearGradient>
  <linearGradient id="rock" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4a2747"/>
    <stop offset="0.7" stop-color="#7b3f57"/>
    <stop offset="1" stop-color="#c0675f"/>
  </linearGradient>
  <linearGradient id="cliff" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#3a1f45"/>
    <stop offset="1" stop-color="#7a3d58"/>
  </linearGradient>
  <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#ffd3a0"/>
    <stop offset="0.3" stop-color="#d99a7c"/>
    <stop offset="1" stop-color="#7c4659"/>
  </linearGradient>
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="7" result="n"/>
    <feColorMatrix type="saturate" values="0"/>
    <feComponentTransfer><feFuncA type="table" tableValues="0 0.07"/></feComponentTransfer>
    <feComposite in2="SourceGraphic" operator="in"/>
  </filter>
  <filter id="soft"><feGaussianBlur stdDeviation="2"/></filter>
  <clipPath id="frame"><rect x="28" y="28" width="968" height="968"/></clipPath>
</defs>

<rect width="1024" height="1024" fill="#f3e6cc"/>
<g clip-path="url(#frame)">
  <!-- sky -->
  <rect x="0" y="0" width="1024" height="660" fill="url(#sky)"/>
  <g id="stars"></g>
  <!-- long sunset clouds -->
  <g opacity="0.75">
    <rect x="60" y="300" width="300" height="10" rx="5" fill="#f08a78"/>
    <rect x="120" y="318" width="210" height="7" rx="4" fill="#ffb38a"/>
    <rect x="770" y="350" width="240" height="9" rx="5" fill="#f0927a"/>
    <rect x="820" y="366" width="160" height="6" rx="3" fill="#ffc08f"/>
    <rect x="40" y="440" width="190" height="8" rx="4" fill="#ffc890"/>
    <rect x="860" y="470" width="150" height="7" rx="4" fill="#ffd59a"/>
  </g>
  <!-- sun -->
  <circle cx="662" cy="590" r="330" fill="url(#sunglow)"/>
  <circle cx="662" cy="600" r="112" fill="#ffe7a6"/>
  <circle cx="662" cy="600" r="112" fill="none" stroke="#fff4cf" stroke-width="3" opacity="0.6"/>
  <!-- distant isles -->
  <path d="M760 642 Q820 610 870 622 Q930 600 1000 628 L1024 642 Z" fill="#9b4a73" opacity="0.75"/>
  <path d="M430 642 Q470 628 520 634 Q540 630 560 642 Z" fill="#a8507a" opacity="0.6"/>

  <!-- sea -->
  <rect x="0" y="640" width="1024" height="384" fill="url(#sea)"/>
  <g id="sunpath"></g>
  <g id="ripples"></g>

  <!-- sea stack and Sunbell tower -->
  <path d="M548 660 L566 612 L584 590 L600 566 L626 556 L700 552 L728 562 L748 590 L764 618 L780 660 Z" fill="url(#rock)"/>
  <path d="M700 552 L728 562 L748 590 L764 618 L780 660 L742 660 L732 610 L712 576 Z" fill="#d97a64" opacity="0.55"/>
  <ellipse cx="664" cy="664" rx="140" ry="8" fill="#ffd28a" opacity="0.35"/>
  <!-- tower shaft -->
  <path d="M630 558 L640 312 L688 312 L698 558 Z" fill="url(#tower)"/>
  <g fill="#e2a24a" opacity="0.9">
    <rect x="636" y="470" width="58" height="7"/>
    <rect x="638" y="390" width="54" height="6"/>
  </g>
  <g fill="#ffcf6e">
    <path d="M658 530 h12 v-14 a6 6 0 0 0 -12 0 z"/>
    <path d="M659 448 h10 v-13 a5 5 0 0 0 -10 0 z"/>
    <path d="M659 368 h10 v-13 a5 5 0 0 0 -10 0 z"/>
  </g>
  <!-- gallery -->
  <rect x="624" y="300" width="80" height="14" rx="2" fill="#f7dcc0"/>
  <rect x="624" y="312" width="80" height="4" fill="#a8606e"/>
  <!-- bell glow -->
  <circle cx="664" cy="262" r="150" fill="url(#bellglow)"/>
  <g id="rays" stroke="#ffe7a3" stroke-linecap="round" opacity="0.55"></g>
  <!-- belvedere with open arches -->
  <rect x="632" y="236" width="64" height="64" fill="#2b1e4d" opacity="0.35"/>
  <g fill="#ffeacd">
    <rect x="630" y="232" width="9" height="68"/>
    <rect x="660" y="232" width="8" height="68" opacity="0"/>
    <rect x="689" y="232" width="9" height="68"/>
  </g>
  <!-- the golden bell -->
  <path d="M664 240 C650 240 646 252 646 266 C646 280 641 286 636 292 L692 292 C687 286 682 280 682 266 C682 252 678 240 664 240 Z" fill="url(#bell)"/>
  <rect x="634" y="290" width="60" height="5" rx="2" fill="#b8661c"/>
  <circle cx="664" cy="298" r="5" fill="#ffd66e"/>
  <!-- dome and spire -->
  <rect x="624" y="226" width="80" height="10" rx="2" fill="#f7dcc0"/>
  <path d="M630 226 Q664 168 698 226 Z" fill="#e7a24a"/>
  <path d="M664 172 Q690 190 698 226 L680 226 Q676 196 664 172 Z" fill="#b8661c" opacity="0.6"/>
  <rect x="662" y="150" width="4" height="26" fill="#e7a24a"/>
  <circle cx="664" cy="148" r="5" fill="#ffe08a"/>

  <!-- left cliff with terraced town -->
  <path d="M0 400 L60 392 L120 410 L190 430 L250 468 L300 510 L350 556 L400 600 L440 640 L470 668 L0 668 Z" fill="url(#cliff)"/>
  <g id="town"></g>
  <g id="cypress"></g>

  <!-- boats -->
  <g id="boats"></g>
  <!-- gulls -->
  <g fill="none" stroke="#2a1d45" stroke-width="2.4" stroke-linecap="round" opacity="0.8">
    <path d="M790 250 q8 -8 16 0 q8 -8 16 0"/>
    <path d="M840 290 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M520 360 q6 -6 12 0 q6 -6 12 0"/>
  </g>

  <!-- foreground terrace -->
  <g id="balustrade"></g>
  <g id="flowersL"></g>
  <g id="flowersR"></g>
  <!-- two glasses and a lantern on the rail -->
  <g>
    <path d="M560 846 l-10 -30 h22 z" fill="#ffe3a8" opacity="0.9"/>
    <rect x="559" y="846" width="3" height="16" fill="#f6e2c6"/>
    <rect x="551" y="860" width="19" height="3" rx="1" fill="#f6e2c6"/>
    <path d="M600 846 l-10 -30 h22 z" fill="#ffe3a8" opacity="0.9"/>
    <rect x="599" y="846" width="3" height="16" fill="#f6e2c6"/>
    <rect x="591" y="860" width="19" height="3" rx="1" fill="#f6e2c6"/>
    <circle cx="660" cy="836" r="40" fill="url(#bellglow)" opacity="0.8"/>
    <rect x="648" y="822" width="24" height="38" rx="3" fill="#ffd77a"/>
    <rect x="645" y="816" width="30" height="7" rx="2" fill="#3a2342"/>
    <rect x="645" y="858" width="30" height="5" rx="2" fill="#3a2342"/>
    <rect x="658" y="808" width="4" height="9" fill="#3a2342"/>
  </g>

  <!-- title -->
  <text x="512" y="196" text-anchor="middle" class="title" font-size="186" textLength="880" lengthAdjust="spacingAndGlyphs" fill="#1b1036" opacity="0.55" transform="translate(5,7)">SOLVARRA</text>
  <text x="512" y="196" text-anchor="middle" class="title" font-size="186" textLength="880" lengthAdjust="spacingAndGlyphs" fill="#9a4a1e" transform="translate(2,3)">SOLVARRA</text>
  <text x="512" y="196" text-anchor="middle" class="title" font-size="186" textLength="880" lengthAdjust="spacingAndGlyphs" fill="url(#gold)">SOLVARRA</text>
  <line x1="150" y1="226" x2="874" y2="226" stroke="#ffd98c" stroke-width="2" opacity="0.7"/>

  <rect x="0" y="0" width="1024" height="1024" filter="url(#grain)" fill="#000"/>
</g>

<!-- bottom band with subtitle -->
<rect x="28" y="942" width="968" height="54" fill="#f3e6cc"/>
<text x="512" y="980" text-anchor="middle" class="sub" font-size="31" letter-spacing="9" fill="#3b2140">ISLE OF THE SUNBELL</text>
<rect x="120" y="969" width="120" height="2" fill="#c76a3a"/>
<rect x="784" y="969" width="120" height="2" fill="#c76a3a"/>
<rect x="28" y="28" width="968" height="968" fill="none" stroke="#3b2140" stroke-width="2"/>
</svg>

<script>
(function(){
  const NS = 'http://www.w3.org/2000/svg';
  let seed = 20261121;
  const rnd = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const el = (parent, tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const k in attrs) n.setAttribute(k, attrs[k]);
    document.getElementById(parent).appendChild(n);
    return n;
  };

  // stars in the upper sky
  for (let i = 0; i < 70; i++) {
    const x = 40 + rnd() * 944, y = 40 + Math.pow(rnd(), 1.6) * 260;
    el('stars', 'circle', {cx: x, cy: y, r: (0.6 + rnd() * 1.4).toFixed(2), fill: '#fff4d8', opacity: (0.3 + rnd() * 0.6).toFixed(2)});
  }

  // golden path of the setting sun on the water
  for (let y = 646; y < 940; y += 7) {
    const t = (y - 646) / 300;
    const half = 36 + t * 150;
    for (let k = 0; k < 3; k++) {
      const w = 10 + rnd() * (40 + t * 60);
      const x = 662 - half + rnd() * (half * 2 - w);
      el('sunpath', 'rect', {x: x.toFixed(1), y: y + rnd() * 3, width: w.toFixed(1), height: (2 + t * 2.5).toFixed(1), rx: 1.5,
        fill: rnd() < 0.5 ? '#ffe39c' : '#ffc46a', opacity: (0.85 - t * 0.45).toFixed(2)});
    }
  }
  // soft ripples across the bay
  for (let i = 0; i < 60; i++) {
    const y = 660 + Math.pow(rnd(), 1.3) * 270;
    const x = rnd() * 1024;
    if (Math.abs(x - 662) < 120 + (y - 646) * 0.5) continue;
    el('ripples', 'rect', {x: x, y: y, width: 14 + rnd() * 40, height: 2, rx: 1, fill: '#9fd6dc', opacity: (0.15 + rnd() * 0.25).toFixed(2)});
  }

  // terraced white town on the cliff, windows already lit
  const cliffTop = x => {
    const pts = [[0,400],[60,392],[120,410],[190,430],[250,468],[300,510],[350,556],[400,600],[440,640],[470,668]];
    for (let i = 0; i < pts.length - 1; i++) {
      const [x0,y0] = pts[i], [x1,y1] = pts[i+1];
      if (x >= x0 && x <= x1) return y0 + (y1 - y0) * (x - x0) / (x1 - x0);
    }
    return 668;
  };
  const walls = ['#fbeee0', '#f6dccb', '#fde6c8', '#f3d3d6', '#e9e3f0'];
  for (let row = 0; row < 6; row++) {
    for (let x = 6 + row * 8; x < 430; x += 0) {
      const w = 26 + Math.floor(rnd() * 22);
      const top = cliffTop(x + w / 2);
      const y = top + 8 + row * 38 + rnd() * 6;
      if (y + 30 > 668 || y > cliffTop(x + w) + 210) { x += w + 4; continue; }
      const h = 24 + rnd() * 14;
      el('town', 'rect', {x: x, y: y, width: w, height: h, fill: walls[Math.floor(rnd() * walls.length)]});
      el('town', 'rect', {x: x + w * 0.62, y: y, width: w * 0.38, height: h, fill: '#b98192', opacity: 0.45});
      if (rnd() < 0.35) el('town', 'path', {d: `M${x-2} ${y} L${x + w/2} ${y - 9} L${x + w + 2} ${y} Z`, fill: '#d0694a'});
      else el('town', 'rect', {x: x - 1, y: y - 3, width: w + 2, height: 3, fill: '#c98a78'});
      const nwin = Math.max(1, Math.floor(w / 12));
      for (let k = 0; k < nwin; k++) {
        if (rnd() < 0.25) continue;
        const wx = x + 5 + k * ((w - 10) / nwin);
        el('town', 'path', {d: `M${wx} ${y + h - 6} v-9 a3 3 0 0 1 6 0 v9 z`, fill: rnd() < 0.8 ? '#ffcf6a' : '#5a3a5c'});
      }
      x += w + 3 + rnd() * 6;
    }
  }
  // a little domed chapel at the top of town
  el('town', 'rect', {x: 92, y: 360, width: 40, height: 42, fill: '#fbeee0'});
  el('town', 'path', {d: 'M90 360 Q112 326 134 360 Z', fill: '#4f8fb0'});
  el('town', 'rect', {x: 110, y: 318, width: 4, height: 14, fill: '#e7a24a'});
  el('town', 'path', {d: 'M106 398 v-14 a6 6 0 0 1 12 0 v14 z', fill: '#ffcf6a'});
  // strings of festival lights along the terraces
  for (let row = 0; row < 3; row++) {
    for (let x = 30 + row * 20; x < 400; x += 15) {
      const y = cliffTop(x) + 6 + row * 76 + Math.sin(x / 22) * 4;
      if (y > 650) continue;
      el('town', 'circle', {cx: x, cy: y, r: 2.2, fill: '#fff0a8', opacity: 0.9});
    }
  }
  // cypress trees
  for (const [x, y, h] of [[180, 440, 70], [196, 448, 54], [330, 552, 60], [60, 402, 64], [262, 486, 48]]) {
    el('cypress', 'path', {d: `M${x} ${y} C${x - 11} ${y - h * 0.4} ${x - 6} ${y - h * 0.8} ${x} ${y - h} C${x + 6} ${y - h * 0.8} ${x + 11} ${y - h * 0.4} ${x} ${y} Z`, fill: '#23324a'});
  }

  // sailboats
  for (const [x, y, s] of [[300, 668, 1.0], [852, 676, 0.8], [470, 724, 1.25], [960, 652, 0.55]]) {
    el('boats', 'path', {d: `M${x} ${y} l${-18*s} 0 l${4*s} ${7*s} l${30*s} 0 l${4*s} ${-7*s} z`, fill: '#2a1d45'});
    el('boats', 'path', {d: `M${x} ${y - 3*s} l0 ${-46*s} l${22*s} ${44*s} z`, fill: '#fff1d8'});
    el('boats', 'path', {d: `M${x - 3*s} ${y - 3*s} l0 ${-34*s} l${-16*s} ${32*s} z`, fill: '#f6b383'});
    el('boats', 'rect', {x: x - 16*s, y: y + 9*s, width: 34*s, height: 2, fill: '#ffe39c', opacity: 0.6});
  }

  // rays from the bell
  for (let i = 0; i < 24; i++) {
    const a = (i / 24) * Math.PI * 2;
    const r0 = 48, r1 = 70 + (i % 2 ? 40 : 80);
    el('rays', 'line', {x1: 664 + Math.cos(a) * r0, y1: 266 + Math.sin(a) * r0, x2: 664 + Math.cos(a) * r1, y2: 266 + Math.sin(a) * r1, 'stroke-width': i % 2 ? 2 : 3});
  }

  // stone balustrade of a terrace
  el('balustrade', 'rect', {x: 0, y: 862, width: 1024, height: 90, fill: '#5b3150'});
  for (let x = 8; x < 1024; x += 34) {
    el('balustrade', 'path', {d: `M${x} 952 L${x} 940 Q${x - 4} 920 ${x + 6} 900 Q${x - 2} 884 ${x + 4} 874 L${x + 18} 874 Q${x + 24} 884 ${x + 16} 900 Q${x + 26} 920 ${x + 22} 940 L${x + 22} 952 Z`, fill: 'url(#rail)'});
  }
  el('balustrade', 'rect', {x: 0, y: 846, width: 1024, height: 22, fill: '#e8b48c'});
  el('balustrade', 'rect', {x: 0, y: 846, width: 1024, height: 5, fill: '#ffd9a8'});
  el('balustrade', 'rect', {x: 0, y: 866, width: 1024, height: 5, fill: '#7c4659', opacity: 0.7});

  // bougainvillea in both lower corners
  const flowers = (g, cx, cy, spread, n) => {
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2, d = Math.pow(rnd(), 0.7) * spread;
      const x = cx + Math.cos(a) * d * 1.3, y = cy + Math.sin(a) * d * 0.8;
      if (rnd() < 0.3) el(g, 'ellipse', {cx: x, cy: y, rx: 7 + rnd() * 6, ry: 4 + rnd() * 3, fill: rnd() < 0.5 ? '#1f4a3a' : '#2d6046', transform: `rotate(${(rnd() * 180).toFixed(0)} ${x.toFixed(0)} ${y.toFixed(0)})`});
      else el(g, 'circle', {cx: x, cy: y, r: 4 + rnd() * 6, fill: ['#e8327c', '#ff5c9a', '#c21f66', '#ff8cbc'][Math.floor(rnd() * 4)], opacity: 0.95});
    }
  };
  flowers('flowersL', 40, 820, 150, 320);
  flowers('flowersL', 10, 660, 90, 120);
  flowers('flowersR', 1000, 840, 140, 300);
  flowers('flowersR', 1015, 700, 70, 80);
})();
</script>
</body></html>
